<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Illustration — Before Tax</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }

    .illustration {
      --shield-blue-light: #6e8cfb;
      --shield-blue-dark: #3b5fe0;
      --bg-top: #f5f8ff;
      --bg-bottom: #e8edfb;
      --icon-blue: #5b7de8;

      position: relative;
      width: min(100%, 300px);
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      box-shadow:
        0 20px 40px -12px rgba(59, 95, 224, 0.18),
        0 8px 16px -8px rgba(15, 23, 42, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      overflow: hidden;
    }

    .orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      translate: -50% -50%;
      border-radius: 50%;
      border-style: dashed;
      border-color: rgba(148, 163, 184, 0.55);
      pointer-events: none;
    }

    .orbit--outer { width: 88%; height: 42%; border-width: 1.5px; }
    .orbit--inner { width: 72%; height: 34%; border-width: 1px; border-color: rgba(203, 213, 225, 0.7); }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      translate: -50% -46%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .pedestal {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -6px;
      z-index: 1;
    }

    .pedestal__top {
      width: 88px;
      height: 14px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, #f8faff 0%, #e4eaf6 45%, #cdd6ea 100%);
      box-shadow: 0 4px 10px rgba(59, 95, 224, 0.12), inset 0 -2px 4px rgba(0, 0, 0, 0.04);
    }

    .pedestal__base {
      width: 112px;
      height: 18px;
      margin-top: -5px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 35%, #eef2fa 0%, #d8e0f0 50%, #b8c4de 100%);
      box-shadow: 0 6px 14px rgba(59, 95, 224, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .shield {
      position: relative;
      width: 76px;
      height: 92px;
      margin-bottom: -10px;
      z-index: 3;
      filter: drop-shadow(0 10px 18px rgba(59, 95, 224, 0.35));
    }

    .shield__body {
      position: absolute;
      inset: 0;
      background: linear-gradient(155deg, #9db0ff 0%, var(--shield-blue-light) 35%, var(--shield-blue-dark) 100%);
      clip-path: polygon(50% 0%, 92% 16%, 92% 52%, 50% 100%, 8% 52%, 8% 16%);
      box-shadow: inset 0 2px 8px rgba(255, 255, 255, 0.55), inset 0 -4px 10px rgba(30, 50, 140, 0.25);
    }

    .shield__body::before {
      content: '';
      position: absolute;
      inset: 6px 10px 20px;
      background: linear-gradient(165deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.08) 55%, transparent 100%);
      clip-path: polygon(50% 4%, 82% 18%, 82% 48%, 50% 88%, 18% 48%, 18% 18%);
    }

    .shield__body::after {
      content: '';
      position: absolute;
      inset: 10px 14px 28px;
      border: 2px solid rgba(255, 255, 255, 0.22);
      clip-path: polygon(50% 6%, 78% 18%, 78% 46%, 50% 82%, 22% 46%, 22% 18%);
    }

    .shield__lock {
      position: absolute;
      left: 50%;
      top: 46%;
      translate: -50% -50%;
      width: 30px;
      height: 30px;
      stroke: #fff;
      fill: rgba(255, 255, 255, 0.12);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .satellite {
      position: absolute;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(59, 95, 224, 0.06);
      z-index: 4;
    }

    .satellite svg {
      width: 20px;
      height: 20px;
      stroke: var(--icon-blue);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .satellite--tl { left: 10%; top: 22%; }
    .satellite--tr { right: 10%; top: 22%; }
    .satellite--bl { left: 8%; bottom: 24%; }
    .satellite--br { right: 8%; bottom: 24%; }
  </style>
</head>
<body>
  <div class="illustration" role="img" aria-label="Security protection illustration">
    <div class="orbit orbit--outer"></div>
    <div class="orbit orbit--inner"></div>

    <div class="satellite satellite--tl">
      <svg viewBox="0 0 24 24" aria-hidden>
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="M3 7l9 6 9-6" />
      </svg>
    </div>
    <div class="satellite satellite--tr">
      <svg viewBox="0 0 24 24" aria-hidden>
        <rect x="7" y="2" width="10" height="20" rx="2" />
        <path d="M11 18h2" />
      </svg>
    </div>
    <div class="satellite satellite--bl">
      <svg viewBox="0 0 24 24" aria-hidden>
        <path d="M9 12l2 2 4-4" />
        <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z" />
      </svg>
    </div>
    <div class="satellite satellite--br">
      <svg viewBox="0 0 24 24" aria-hidden>
        <rect x="5" y="11" width="14" height="10" rx="2" />
        <path d="M8 11V8a4 4 0 0 1 8 0v3" />
      </svg>
    </div>

    <div class="center">
      <div class="shield">
        <div class="shield__body"></div>
        <svg class="shield__lock" viewBox="0 0 24 24" aria-hidden>
          <rect x="5" y="11" width="14" height="10" rx="2" />
          <path d="M8 11V8a4 4 0 0 1 8 0v3" />
        </svg>
      </div>
      <div class="pedestal">
        <div class="pedestal__top"></div>
        <div class="pedestal__base"></div>
      </div>
    </div>
  </div>
</body>
</html>
